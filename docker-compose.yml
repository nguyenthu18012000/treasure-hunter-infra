# Hạ tầng chạy local cho dự án game.
#   Bật:  docker compose up -d
#   Tắt:  docker compose down        (thêm -v để xoá luôn dữ liệu)
#
# Các service Spring chạy trên máy thật kết nối Kafka qua: localhost:9092
# Kafka UI (xem topic, message trên trình duyệt):          http://localhost:8090

name: game

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # Một node vừa làm broker vừa làm controller (chế độ KRaft, không cần Zookeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 3 listener:
      #   PLAINTEXT  :9092  -> app Spring trên máy thật gọi vào localhost:9092
      #   INTERNAL   :29092 -> container khác trong compose (kafka-ui) gọi vào kafka:29092
      #   CONTROLLER :9093  -> Kafka dùng nội bộ, không mở ra ngoài
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Chỉ có 1 broker nên mọi topic nội bộ chỉ có thể có 1 bản sao.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topic tự tạo (khi app gửi vào topic chưa có) sẽ có 3 partition.
      KAFKA_NUM_PARTITIONS: 3
      # Giữ message 7 ngày.
      KAFKA_LOG_RETENTION_HOURS: 168

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
